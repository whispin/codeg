name: Build Windows x64 installer

on:
  push:
    branches:
      - windows-x64-installer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 NSIS installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: windows-x64-installer

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        shell: pwsh
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          RUST_BACKTRACE: short
          HUSKY: "0"
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-windows-build.json"
          [System.IO.File]::WriteAllText($configPath, '{"bundle":{"createUpdaterArtifacts":false}}')
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci --no-sign --config $configPath -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe"
          if (-not $installers) { throw "No NSIS installer was produced." }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File -Encoding ascii "$($installer.FullName).sha256"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeg-windows-x64-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error
          retention-days: 14
